services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio
    networks:
      - reverse-proxy-network
    restart: unless-stopped
    read_only: true
    volumes:
      # live.json from scripts/live_status.py (cron on the host); missing file = badges stay hidden
      - ./runtime:/usr/share/nginx/html/live:ro
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  reverse-proxy-network:
    external: true
