[project]
name = "portfolio-site"
version = "2.0.0"
description = "Tomasz Koralewski — portfolio rendered to static HTML"
requires-python = ">=3.13"
dependencies = ["jinja2>=3.1.6"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Long Polish prose in data.py reads better unwrapped.
per-file-ignores = { "data.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
