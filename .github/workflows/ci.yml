name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Build site
        run: uv run python build.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The image is not published; this catches a broken Dockerfile or nginx.conf before the server.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: portfolio-site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name portfolio --read-only --tmpfs /tmp -p 8080:8080 portfolio-site:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Python Digest Polska'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          curl -fsSI http://127.0.0.1:8080/static/style.css | grep -qi '^content-security-policy:'
          curl -fsS -o /dev/null http://127.0.0.1:8080/Tomasz_Koralewski_CV.pdf
      - name: Container logs
        if: failure()
        run: docker logs portfolio
