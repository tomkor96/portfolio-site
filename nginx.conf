# Serves the static build inside the container; TLS and rate limits live in the reverse proxy.
server {
    # IPv4 only: the reverse proxy reaches us over the Docker network, and an IPv6 listen
    # makes nginx exit where the container has IPv6 disabled.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    # Behind the reverse proxy: /en -> /en/ must not redirect to the internal :8080.
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        # CSS and JS URLs carry ?v=<content hash> (build.py), so a long cache is safe.
        # `expires` instead of add_header keeps the server-level security headers inherited.
        expires 30d;
    }

    # Written every 5 minutes by scripts/live_status.py on the host and bind-mounted read-only.
    location /live/ {
        expires -1;
    }

    # Analytics hits go to GoatCounter on the Docker network (ops/goatcounter). Resolved per
    # request, so the site still starts where that container doesn't exist (CI, local runs).
    location = /count {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $goatcounter http://goatcounter:8080;
        proxy_pass $goatcounter;
        proxy_set_header Host tkstats.toadres.pl;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
